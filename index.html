<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CATATAN &amp; Keuangan</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header>
    <h1>📔 DYLL BINDER</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="notes">Catatan</button>
      <button class="tab-btn" data-tab="finance">Keuangan</button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnSettings" title="Pengaturan tampilan">⚙</button>
  </header>

  <main>
    <!-- ===== CATATAN ===== -->
    <section class="panel active" id="panel-notes">
      <div class="notes-side">
        <div class="notes-side__top">
          <input type="search" id="searchInput" placeholder="Cari catatan…" />
          <button class="btn-add" id="btnNewNote" title="Catatan baru">+</button>
        </div>
        <div class="note-list" id="noteList"></div>
      </div>
      <div class="note-edit" id="noteEdit">
        <div class="note-edit__empty" id="noteEmpty">Pilih catatan, atau tekan “+” untuk membuat yang baru.</div>
        <div id="noteForm" style="display:none;flex:1;flex-direction:column;min-height:0;">
          <div class="note-edit__bar">
            <span class="muted" id="noteMeta"></span>
            <button class="icon-btn" id="btnDeleteNote" title="Hapus">🗑</button>
          </div>
          <input class="title" id="noteTitle" placeholder="Judul catatan" />
          <textarea id="noteContent" placeholder="Tulis materi kuliah, ide, atau apa pun di sini…"></textarea>
        </div>
      </div>
    </section>

    <!-- ===== KEUANGAN ===== -->
    <section class="panel" id="panel-finance">
      <div class="fin-summary">
        <div class="fin-card"><span class="fin-card__label">Saldo</span><span class="fin-card__val" id="statBalance">Rp 0</span></div>
        <div class="fin-card income"><span class="fin-card__label">Pemasukan</span><span class="fin-card__val" id="statIncome">Rp 0</span></div>
        <div class="fin-card expense"><span class="fin-card__label">Pengeluaran</span><span class="fin-card__val" id="statExpense">Rp 0</span></div>
      </div>

      <form class="fin-form" id="txForm">
        <select name="type">
          <option value="expense">Keluar</option>
          <option value="income">Masuk</option>
        </select>
        <input name="desc" placeholder="Catatan (misal. Makan siang)" />
        <input name="amount" type="number" min="0" placeholder="Jumlah (Rp)" required />
        <select name="category">
          <option>Makanan</option><option>Transportasi</option><option>Kuliah</option>
          <option>Belanja</option><option>Hiburan</option><option>Lainnya</option>
        </select>
        <button type="submit">Tambahkan</button>
      </form>

      <div id="txList"></div>
    </section>
  </main>

  <!-- ===== POPOVER PENGATURAN ===== -->
  <div class="settings-pop" id="settingsPop">
    <h4>Warna aksen</h4>
    <div class="swatch-row" id="accentSwatches"></div>
    <div class="row"><span>Kustom</span><input type="color" id="accentCustom" /></div>

    <h4>Warna teks</h4>
    <div class="row"><span>Kustom</span><input type="color" id="textCustom" /></div>

    <h4>Tema</h4>
    <div class="theme-switch">
      <button data-theme="light" class="active">☀ Terang</button>
      <button data-theme="dark">☾ Gelap</button>
    </div>

    <h4>Data</h4>
    <div class="data-row">
      <button id="btnExport">Ekspor</button>
      <label for="importFile" style="font-size:11.5px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);">Impor</label>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button id="btnReset">Hapus semua</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
